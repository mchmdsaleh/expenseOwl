services:
  expenseowl:
    build: .
    ports:
      - "9080:9080"
    env_file: .env
    environment:
      - STORAGE_TYPE=postgres
      - STORAGE_URL=db:5432/expenseowldb
      - STORAGE_USER=owluser
      - STORAGE_PASS=owlpass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=expenseowldb
      - POSTGRES_USER=owluser
      - POSTGRES_PASSWORD=owlpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owluser -d expenseowldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
